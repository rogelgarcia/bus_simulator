<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Grass Debug v2</title>
    <link rel="icon" href="../favicon.ico" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../src/graphics/gui/shared/styles.css" />
    <link rel="stylesheet" href="../src/graphics/gui/perf_bar/styles.css" />
    <link rel="stylesheet" href="../src/graphics/gui/grass_debugger_v2/styles.css?v=collapsible-menu-1" />
</head>
<body class="grass-debug-v2">
<div id="game-viewport"><canvas id="game-canvas" aria-label="Grass Debug v2 scene"></canvas></div>
<div id="scene-loading" class="grass-v2-loading" role="status">Loading...</div>
<button type="button" id="toggle-controls" class="grass-v2-panel-toggle" aria-controls="grass-controls" aria-expanded="true" aria-label="Minimize controls" title="Minimize controls">
    <span class="ui-icon" aria-hidden="true">remove</span>
</button>
<aside id="grass-controls" class="ui-panel is-interactive grass-v2-panel" aria-label="Grass controls">
    <p id="scene-status" role="status" hidden></p>
    <section class="grass-v2-section" aria-labelledby="camera-heading">
        <h2 class="ui-section-label is-tight" id="camera-heading">Camera</h2>
        <div class="grass-v2-controls">
            <button type="button" id="bus-view">Bus camera <kbd>1</kbd></button>
            <button type="button" id="overview">Overview <kbd>2</kbd></button>
            <button type="button" id="grass-view">Along the grass</button>
            <button type="button" id="copy-camera" title="Copy camera X Y Z and yaw pitch roll (degrees)" aria-live="polite">Copy</button>
        </div>
    </section>
    <section class="grass-v2-section" aria-labelledby="curve-heading">
        <h2 class="ui-section-label is-tight" id="curve-heading">Curved layout</h2>
        <label class="grass-v2-fade">Road radius
            <select id="curve-radius" aria-label="Curve radius" disabled>
                <option value="off">Straight reference only</option>
                <option value="18">18 m bend</option>
                <option value="30">30 m bend</option>
            </select>
        </label>
        <div class="grass-v2-controls">
            <button type="button" data-curve-camera="curve" disabled>Curve overview</button>
            <button type="button" data-curve-camera="curve-inner" disabled>Inside edge</button>
            <button type="button" data-curve-camera="curve-outer" disabled>Outside edge</button>
        </div>
    </section>
    <section class="grass-v2-section" aria-labelledby="grass-heading">
        <h2 class="ui-section-label is-tight" id="grass-heading">Grass</h2>
        <div class="grass-v2-modes grass-v2-lods" role="group" aria-label="Grass detail">
            <button type="button" data-grass-mode="AUTO" aria-pressed="true" disabled>Auto</button>
            <button type="button" data-grass-mode="OFF" aria-pressed="false" disabled>OFF</button>
            <button type="button" data-grass-mode="LOD0" aria-pressed="false" disabled>LOD0</button>
            <button type="button" data-grass-mode="LOD1" aria-pressed="false" disabled>LOD1</button>
            <button type="button" data-grass-mode="LOD2" aria-pressed="false" disabled>LOD2</button>
            <button type="button" data-grass-mode="LOD3" aria-pressed="false" disabled>LOD3</button>
            <button type="button" data-grass-mode="LOD4" aria-pressed="false" disabled>LOD4</button>
            <button type="button" data-grass-mode="LOD5" aria-pressed="false" disabled>LOD5</button>
        </div>
        <p id="grass-ranges" class="grass-v2-ranges">Baked grass · Switches: 0.6 / 0.8 / 20 / 30 / 40 m</p>
        <div class="grass-v2-version-links"><a href="?grass=patches" data-grass-strategy="patches">Fixed patches</a><a href="?grass=baked" data-grass-strategy="baked">Latest baked</a><a href="?grass=current" data-grass-strategy="current">Original lit</a></div>
        <label class="grass-v2-fade">Blend
            <select id="grass-fade" disabled>
                <option value="canopy">Continuous canopy</option>
                <option value="dissolve">Opaque dissolve</option>
                <option value="coverage">Coverage</option>
                <option value="alpha">Alpha</option>
                <option value="staggered">Staggered</option>
            </select>
        </label>
        <output id="grass-counts" class="grass-v2-counts" tabindex="0" aria-live="polite"></output>
    </section>
    <section class="grass-v2-section" aria-labelledby="land-heading">
        <h2 class="ui-section-label is-tight" id="land-heading">Surrounding land</h2>
        <div class="grass-v2-modes grass-v2-land" role="group" aria-label="Land substrate">
            <button type="button" data-land-surface="gravelly_sand" aria-pressed="true" title="Current game substrate · Gravelly Sand" disabled>Gravelly Sand</button>
            <button type="button" data-land-surface="forest_ground_06" aria-pressed="false" title="Planter substrate · Forest Ground 06" disabled>Forest Soil</button>
            <button type="button" data-land-surface="brown_mud" aria-pressed="false" title="Moist fine earth · Poly Haven Brown Mud · 1.3 m scale" disabled>Brown Earth</button>
        </div>
    </section>
    <section class="grass-v2-section" aria-labelledby="benchmark-heading">
        <h2 class="ui-section-label is-tight" id="benchmark-heading">Benchmark</h2>
        <div class="grass-v2-controls">
            <button type="button" id="run-benchmark" disabled>Run</button>
        </div>
        <output id="benchmark-status" class="grass-v2-benchmark-result" tabindex="0" aria-live="polite" hidden></output>
        <div id="benchmark-results" role="list" aria-label="Benchmark results" aria-live="polite"></div>
    </section>
</aside>
<script type="importmap">
{
    "imports": {
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2DistanceGrass.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2DistanceGrass.js?v=immutable-patches-1",
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2CurveGrass.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2CurveGrass.js?v=immutable-patches-1",
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2FieldShadows.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2FieldShadows.js?v=immutable-patches-1",
        "../src/graphics/engine3d/grass/runtime/GrassBoundaryMask.js": "../src/graphics/engine3d/grass/runtime/GrassBoundaryMask.js?v=immutable-patches-1",
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2PatchGrass.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2PatchGrass.js?v=patch-edges-1",
        "../src/graphics/engine3d/grass/runtime/GrassRuntimeAsset.js": "../src/graphics/engine3d/grass/runtime/GrassRuntimeAsset.js?v=offline-leaf-fill-1",
        "../src/graphics/engine3d/grass/runtime/GrassPatchRenderer.js": "../src/graphics/engine3d/grass/runtime/GrassPatchRenderer.js?v=extended-reach-1",
        "../src/graphics/engine3d/grass/runtime/GrassPatchGeometry.js": "../src/graphics/engine3d/grass/runtime/GrassPatchGeometry.js?v=patch-edges-1",
        "../src/graphics/engine3d/grass/runtime/GrassPatchMaterials.js": "../src/graphics/engine3d/grass/runtime/GrassPatchMaterials.js?v=patch-edges-1",
        "../src/graphics/shaders/materials/grass/GrassPatchShaderLoader.js": "../src/graphics/shaders/materials/grass/GrassPatchShaderLoader.js?v=patch-edges-1",
        "../src/graphics/shaders/materials/grass/GrassBoundaryShaderLoader.js": "../src/graphics/shaders/materials/grass/GrassBoundaryShaderLoader.js?v=patch-edges-1",
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2Benchmark.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2Benchmark.js?v=collapsible-menu-2",
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2BenchmarkRoute.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2BenchmarkRoute.js?v=roadside-flight-smooth-1",
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2View.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2View.js?v=collapsible-menu-2",
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2Scene.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2Scene.js?v=curved-boundary-1",
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2Land.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2Land.js?v=curved-boundary-1",
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2TransitionCanopy.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2TransitionCanopy.js?v=canopy-seam-2",
        "../src/graphics/gui/grass_debugger_v2/GrassDebugV2FloorMaterial.js": "../src/graphics/gui/grass_debugger_v2/GrassDebugV2FloorMaterial.js?v=transition-lighting-1",
        "../src/graphics/shaders/core/MaterialShaderHookRegistry.js": "../src/graphics/shaders/core/MaterialShaderHookRegistry.js?v=transition-blend-startup-1",
        "../assets/public/pbr/_catalog_index.js": "../assets/public/pbr/_catalog_index.js?v=brown-earth-1",
        "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
    }
}
</script>
<script type="module" src="../src/graphics/gui/grass_debugger_v2/main.js?v=collapsible-menu-2"></script>
</body>
</html>
